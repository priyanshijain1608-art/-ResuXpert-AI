<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResuXpert Dashboard</title>
    <style>
        :root {
            --primary: #1a73e8; /* Google Blue */
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #202124;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 40px 20px;
            margin: 0;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary); }
        .row { display: flex; gap: 20px; margin-bottom: 20px; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        textarea {
            height: 200px; padding: 12px; border: 1px solid #dadce0;
            border-radius: 8px; resize: none; font-size: 14px;
        }
        textarea:focus { outline: 2px solid var(--primary); }
        button {
            width: 100%; background-color: var(--primary); color: white;
            border: none; padding: 14px; font-size: 16px; font-weight: 600;
            border-radius: 8px; cursor: pointer;
        }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .result-box {
            background: var(--card); border: 1px solid #dadce0;
            border-radius: 8px; padding: 24px; margin-top: 30px; display: none;
        }
        .bullet-item { background: #f1f3f4; padding: 12px; border-left: 4px solid var(--primary); margin-bottom: 12px; border-radius: 4px; }
        .skill-tag { display: inline-block; background: #e8f0fe; color: #1967d2; padding: 6px 12px; border-radius: 16px; margin: 4px; font-size: 13px; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <h1>ResuXpert Engine</h1>
    
    <div class="row">
        <div class="input-group">
            <label for="resumeText">Your Current Resume Text</label>
            <textarea id="resumeText" placeholder="Paste your resume context here... (min 20 chars)"></textarea>
        </div>
        <div class="input-group">
            <label for="jobDesc">Target Job Description</label>
            <textarea id="jobDesc" placeholder="Paste the job description here... (min 20 chars)"></textarea>
        </div>
    </div>

    <button id="optimizeBtn" onclick="runOptimization()">Analyze & Optimize via Gemini API</button>

    <!-- Results Panel -->
    <div id="results" class="result-box">
        <h2>Analysis & Optimization Results</h2>
        <h3>Skill Gap Analysis</h3>
        <p id="gapSummary"></p>

        <h3>Recommended Keywords</h3>
        <div id="skillsContainer"></div>

        <h3>Optimized Google X-Y-Z Bullets</h3>
        <div id="bulletsContainer"></div>
    </div>
</div>

<script>
async function runOptimization() {
    const resume = document.getElementById("resumeText").value.trim();
    const jd = document.getElementById("jobDesc").value.trim();

    if (resume.length < 20 || jd.length < 20) {
        alert("Please enter at least 20 characters in both fields.");
        return;
    }

    const btn = document.getElementById("optimizeBtn");
    btn.disabled = true;
    btn.innerText = "Analyzing...";
    document.getElementById("results").style.display = "none";

    try {
        const response = await fetch("http://localhost:8000/api/v1/optimize", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                // FIXED: Cleaned up the regular expression syntax error cleanly
                raw_resume_text: resume.replace(/\n/g, " "),
                target_job_description: jd.replace(/\n/g, " ")
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert("Error: " + (data.detail || "Something went wrong"));
            return;
        }

        // Show results box
        document.getElementById("results").style.display = "block";
        document.getElementById("gapSummary").innerText = data.summary_of_gaps;

        // Render Skills
        const skillsContainer = document.getElementById("skillsContainer");
        skillsContainer.innerHTML = "";
        data.recommended_skills_to_add.forEach(skill => {
            skillsContainer.innerHTML += `<span class="skill-tag">${skill}</span>`;
        });

        // Render Bullets
        const bulletsContainer = document.getElementById("bulletsContainer");
        bulletsContainer.innerHTML = "";
        data.optimized_bullets.forEach(item => {
            bulletsContainer.innerHTML += `
                <div class="bullet-item">
                    <p><strong>Original:</strong> ${item.original}</p>
                    <p style="color:#1a73e8"><strong>Optimized:</strong> ${item.optimized}</p>
                    <p style="font-style: italic; font-size: 13px;"><strong>Logic:</strong> ${item.explanation}</p>
                </div>
            `;
        });

    } catch (error) {
        alert("Network Error: Could not connect to the backend server.");
    } finally {
        btn.disabled = false;
        btn.innerText = "Analyze & Optimize via Gemini API";
    }
}
</script>
</body>
</html>
